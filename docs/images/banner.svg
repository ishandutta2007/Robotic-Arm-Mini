<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    
    <!-- Neon Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f355da"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    
    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.03"/>
      <circle cx="40" cy="40" r="1" fill="#ffffff" fill-opacity="0.1"/>
    </pattern>
  </defs>

  <style>
    /* CSS Animations */
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }
    @keyframes rotateGear {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -80;
      }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes glowPulse {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(0, 242, 254, 0.4)); }
      50% { filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.9)); }
    }
    
    /* Classes binding animations */
    .bg-grid {
      animation: pulse 8s ease-in-out infinite;
    }
    .gear {
      transform-origin: 950px 200px;
      animation: rotateGear 20s linear infinite;
    }
    .gear-small {
      transform-origin: 880px 245px;
      animation: rotateGear 12s linear infinite reverse;
    }
    .flow-line {
      stroke-dasharray: 10, 30;
      animation: dash 3s linear infinite;
    }
    .floating-group {
      animation: float 6s ease-in-out infinite;
    }
    .glow-active {
      animation: glowPulse 4s ease-in-out infinite;
    }
    .text-title {
      font-family: 'Outfit', 'Inter', 'Segoe UI', sans-serif;
      font-weight: 900;
      letter-spacing: 5px;
    }
    .text-subtitle {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      font-weight: 500;
      letter-spacing: 3px;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect class="bg-grid" width="1200" height="400" fill="url(#grid)"/>

  <!-- Decorative Tech Elements -->
  <!-- Subtle glowing circular waves -->
  <circle cx="950" cy="200" r="180" fill="none" stroke="#4facfe" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="5 10"/>
  <circle cx="950" cy="200" r="230" fill="none" stroke="#7000ff" stroke-width="1" stroke-opacity="0.08"/>

  <!-- Left/Right borders & accent markings -->
  <path d="M 50 40 L 20 40 L 20 100" fill="none" stroke="#00f2fe" stroke-width="3" opacity="0.7"/>
  <path d="M 1150 360 L 1180 360 L 1180 300" fill="none" stroke="#7000ff" stroke-width="3" opacity="0.7"/>
  
  <!-- Flow Lines (Kinematic paths) -->
  <path class="flow-line" d="M 100 350 L 300 350 L 500 200 L 700 200" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.5"/>
  <path class="flow-line" d="M 850 200 L 950 200" fill="none" stroke="#f355da" stroke-width="2" opacity="0.5" style="animation-delay: -1.5s;"/>

  <!-- Animated Gears on Right Side representing Joint Reducers -->
  <g class="gear" opacity="0.25">
    <circle cx="950" cy="200" r="80" fill="none" stroke="url(#neonCyan)" stroke-width="8" stroke-dasharray="15 8"/>
    <circle cx="950" cy="200" r="50" fill="none" stroke="url(#neonCyan)" stroke-width="2"/>
    <path d="M 950 120 L 950 280 M 870 200 L 1030 200" stroke="#00f2fe" stroke-width="2"/>
  </g>
  <g class="gear-small" opacity="0.2">
    <circle cx="880" cy="245" r="45" fill="none" stroke="url(#neonPurple)" stroke-width="6" stroke-dasharray="10 6"/>
    <circle cx="880" cy="245" r="25" fill="none" stroke="url(#neonPurple)" stroke-width="1.5"/>
  </g>

  <!-- Abstract Robotic Arm Graphic in Center-Right -->
  <g class="floating-group" transform="translate(100, 0)">
    <!-- Base -->
    <path d="M 680 320 L 760 320 L 740 290 L 700 290 Z" fill="#1e293b" stroke="#00f2fe" stroke-width="2" filter="url(#glowCyan)"/>
    <circle cx="720" cy="290" r="12" fill="#0f172a" stroke="#00f2fe" stroke-width="3"/>
    
    <!-- Link 1 -->
    <line x1="720" y1="290" x2="760" y2="180" stroke="url(#neonCyan)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="760" cy="180" r="10" fill="#0f172a" stroke="#f355da" stroke-width="3" filter="url(#glowPurple)"/>
    
    <!-- Link 2 -->
    <line x1="760" y1="180" x2="840" y2="140" stroke="url(#neonPurple)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="840" cy="140" r="8" fill="#0f172a" stroke="#00f2fe" stroke-width="2"/>
    
    <!-- End Effector / Gripper -->
    <path d="M 840 140 L 860 130 L 865 140 M 840 140 L 855 155 L 850 162" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Glowing joint highlights -->
    <circle cx="720" cy="290" r="4" fill="#00f2fe"/>
    <circle cx="760" cy="180" r="4" fill="#f355da"/>
  </g>

  <!-- Left Side Text & Branding -->
  <g transform="translate(80, 0)">
    <!-- Tiny tag/badge -->
    <rect x="0" y="105" width="130" height="24" rx="12" fill="#1e1b4b" stroke="#7000ff" stroke-width="1.5" opacity="0.8"/>
    <text x="65" y="121" fill="#f355da" font-size="10" font-family="'Inter', sans-serif" font-weight="bold" letter-spacing="1.5" text-anchor="middle">OPEN-SOURCE</text>
    
    <!-- Project Title -->
    <text class="text-title glow-active" x="0" y="180" fill="#ffffff" font-size="44">ROBOTIC-ARM</text>
    <text class="text-title" x="0" y="230" fill="url(#neonCyan)" font-size="44">MINI</text>
    
    <!-- Description -->
    <text class="text-subtitle" x="0" y="275" fill="#94a3b8" font-size="15">Super Compact Smart 6-Axis Robot</text>
    
    <!-- Key Feature Badges -->
    <g transform="translate(0, 310)">
      <!-- Badge 1: FOC Stepper -->
      <rect x="0" y="0" width="115" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="15" cy="14" r="4" fill="#00f2fe"/>
      <text x="28" y="18" fill="#cbd5e1" font-size="11" font-family="sans-serif" font-weight="600">FOC Motor</text>

      <!-- Badge 2: CAN Bus -->
      <rect x="125" y="0" width="90" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="140" cy="14" r="4" fill="#f355da"/>
      <text x="153" y="18" fill="#cbd5e1" font-size="11" font-family="sans-serif" font-weight="600">CAN Bus</text>

      <!-- Badge 3: Kinematics -->
      <rect x="225" y="0" width="105" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="240" cy="14" r="4" fill="#7000ff"/>
      <text x="253" y="18" fill="#cbd5e1" font-size="11" font-family="sans-serif" font-weight="600">6-Axis DH</text>
    </g>
  </g>
</svg>
