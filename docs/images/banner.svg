<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#070a14"/><stop offset="100%" stop-color="#020408"/></linearGradient><linearGradient id="neonCyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="neonPurple" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f355da"/><stop offset="100%" stop-color="#7000ff"/></linearGradient><filter id="glowCyan" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="glowPurple" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="12"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#fff" stroke-opacity=".03" stroke-width="1" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="#fff" fill-opacity=".1"/></pattern></defs><style>@keyframes pulse{0%{opacity:.3}50%{opacity:.8}}@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes glowPulse{0%{filter:drop-shadow(0 0 2px rgba(0,242,254,.4))}50%{filter:drop-shadow(0 0 15px rgba(0,242,254,.9))}}.bg-grid{animation:pulse 8s ease-in-out infinite}.gear{transform-origin:950px 200px;animation:rotateGear 20s linear infinite}.gear-small{transform-origin:880px 245px;animation:rotateGear 12s linear infinite reverse}.flow-line{stroke-dasharray:10,30;animation:dash 3s linear infinite}.floating-group{animation:float 6s ease-in-out infinite}.glow-active{animation:glowPulse 4s ease-in-out infinite}.text-title{font-family:&apos;Outfit&apos;,&apos;Inter&apos;,&apos;Segoe UI&apos;,sans-serif;font-weight:900;letter-spacing:5px}.text-subtitle{font-family:&apos;Inter&apos;,&apos;Segoe UI&apos;,sans-serif;font-weight:500;letter-spacing:3px}</style><rect width="1200" height="400" fill="url(#bgGrad)"/><rect width="1200" height="400" fill="url(#grid)" class="bg-grid"/><circle cx="950" cy="200" r="180" fill="none" stroke="#4facfe" stroke-dasharray="5 10" stroke-opacity=".1" stroke-width="1"/><circle cx="950" cy="200" r="230" fill="none" stroke="#7000ff" stroke-opacity=".08" stroke-width="1"/><path fill="none" stroke="#00f2fe" stroke-width="3" d="M 50 40 L 20 40 L 20 100" opacity=".7"/><path fill="none" stroke="#7000ff" stroke-width="3" d="M 1150 360 L 1180 360 L 1180 300" opacity=".7"/><path fill="none" stroke="#00f2fe" stroke-width="2" d="M 100 350 L 300 350 L 500 200 L 700 200" class="flow-line" opacity=".5"/><path fill="none" stroke="#f355da" stroke-width="2" d="M 850 200 L 950 200" class="flow-line" opacity=".5" style="animation-delay:-1.5s"/><g class="gear" opacity=".25"><circle cx="950" cy="200" r="80" fill="none" stroke="url(#neonCyan)" stroke-dasharray="15 8" stroke-width="8"/><circle cx="950" cy="200" r="50" fill="none" stroke="url(#neonCyan)" stroke-width="2"/><path stroke="#00f2fe" stroke-width="2" d="M 950 120 L 950 280 M 870 200 L 1030 200"/></g><g class="gear-small" opacity=".2"><circle cx="880" cy="245" r="45" fill="none" stroke="url(#neonPurple)" stroke-dasharray="10 6" stroke-width="6"/><circle cx="880" cy="245" r="25" fill="none" stroke="url(#neonPurple)" stroke-width="1.5"/></g><g class="floating-group" transform="translate(100, 0)"><path fill="#1e293b" stroke="#00f2fe" stroke-width="2" d="M 680 320 L 760 320 L 740 290 L 700 290 Z" filter="url(#glowCyan)"/><circle cx="720" cy="290" r="12" fill="#0f172a" stroke="#00f2fe" stroke-width="3"/><line x1="720" x2="760" y1="290" y2="180" stroke="url(#neonCyan)" stroke-linecap="round" stroke-width="8"/><circle cx="760" cy="180" r="10" fill="#0f172a" stroke="#f355da" stroke-width="3" filter="url(#glowPurple)"/><line x1="760" x2="840" y1="180" y2="140" stroke="url(#neonPurple)" stroke-linecap="round" stroke-width="6"/><circle cx="840" cy="140" r="8" fill="#0f172a" stroke="#00f2fe" stroke-width="2"/><path fill="none" stroke="#00f2fe" stroke-linecap="round" stroke-width="2.5" d="M 840 140 L 860 130 L 865 140 M 840 140 L 855 155 L 850 162"/><circle cx="720" cy="290" r="4" fill="#00f2fe"/><circle cx="760" cy="180" r="4" fill="#f355da"/></g><g transform="translate(80, 0)"><rect width="130" height="24" x="0" y="105" fill="#1e1b4b" stroke="#7000ff" stroke-width="1.5" opacity=".8" rx="12"/><text x="65" y="121" fill="#f355da" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" letter-spacing="1.5" text-anchor="middle">OPEN-SOURCE</text><text x="0" y="180" fill="#fff" class="text-title glow-active" font-size="44">ROBOTIC-ARM</text><text x="0" y="230" fill="url(#neonCyan)" class="text-title" font-size="44">MINI</text><text x="0" y="275" fill="#94a3b8" class="text-subtitle" font-size="15">Super Compact Smart 6-Axis Robot</text><g transform="translate(0, 310)"><rect width="115" height="28" x="0" y="0" fill="#0f172a" stroke="#334155" stroke-width="1" rx="6"/><circle cx="15" cy="14" r="4" fill="#00f2fe"/><text x="28" y="18" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">FOC Motor</text><rect width="90" height="28" x="125" y="0" fill="#0f172a" stroke="#334155" stroke-width="1" rx="6"/><circle cx="140" cy="14" r="4" fill="#f355da"/><text x="153" y="18" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">CAN Bus</text><rect width="105" height="28" x="225" y="0" fill="#0f172a" stroke="#334155" stroke-width="1" rx="6"/><circle cx="240" cy="14" r="4" fill="#7000ff"/><text x="253" y="18" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">6-Axis DH</text></g></g></svg>